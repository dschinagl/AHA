[project]
name = "aha"
version = "0.1.0"
description = "Official code for the ECCV26 paper \"Learn to Rank: Visual Attribution by Learning Importance Ranking\""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ftfy>=6.3.1",
    "hydra-core==1.4.0.dev9",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.1",
    "regex>=2026.9.3",
    "scikit-learn>=1.9.0",
    "submitit>=1.5.4",
    "tensorboard>=2.21.0",
    "termcolor>=3.3.0",
    "timm>=1.0.29",
    "torch>=2.14.0",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.0",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
torchvision = { index = "pytorch-cu132" }

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aha"]
